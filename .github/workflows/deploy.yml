# .github/workflows/deploy.yml
#
# WHEN: Push to main branch only
# WHAT IT DOES:
#   1. Run tests (same as ci.yml — never deploy broken code)
#   2. Build Docker image using your existing Dockerfile
#   3. Push image to Azure Container Registry (ACR)
#   4. Run Terraform to create/update Azure infrastructure
#   5. Deploy the new image to Azure Container Apps

name: Deploy — utility-charge-service → Azure

on:
  push:
    branches:
      - main       # ONLY triggers on main branch push

env:
  # ACR details — must match terraform/variables.tf defaults
  ACR_NAME: amsg3utilityacr
  ACR_LOGIN_SERVER: amsg3utilityacr.azurecr.io
  IMAGE_NAME: utility-charge-service
  # Terraform state storage — must match terraform/backend.tf
  TF_STATE_RESOURCE_GROUP: ams-g3-tfstate-rg
  TF_STATE_STORAGE_ACCOUNT: amsg3tfstate
  TF_STATE_CONTAINER: tfstate

jobs:

  # ──────────────────────────────────────────────
  # JOB 1: Test
  # Run all tests before doing anything else.
  # If tests fail, the deploy stops here.
  # ──────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw clean test -Dspring.profiles.active=test
        env:
          JWT_SECRET: test-secret-key-for-ci-only-not-production

  # ──────────────────────────────────────────────
  # JOB 2: Build and Push Docker Image to ACR
  # Only runs if tests pass.
  # Uses git commit SHA as the image tag so every
  # deployment is uniquely identified and traceable.
  # ──────────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: test       # waits for test job to pass

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}   # passes the tag to the next job

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image tag from git SHA
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag will be: ${SHORT_SHA}"

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Push image to ACR
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

  # ──────────────────────────────────────────────
  # JOB 3: Terraform Apply
  # Creates or updates all Azure resources.
  # If resources already exist and nothing changed,
  # Terraform does nothing (idempotent).
  # ──────────────────────────────────────────────
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: build-and-push    # waits for image to be pushed to ACR

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init
        env:
          ARM_CLIENT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="subscription_id=${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}" \
            -var="mysql_admin_password=${{ secrets.MYSQL_ADMIN_PASSWORD }}" \
            -var="gateway_jwt_public_key=${{ secrets.GATEWAY_JWT_PUBLIC_KEY }}" \
            -var="service_jwt_private_key=${{ secrets.SERVICE_JWT_PRIVATE_KEY }}" \
            -var="api_gateway_url=${{ secrets.API_GATEWAY_URL }}" \
            -var="image_tag=${{ needs.build-and-push.outputs.image_tag }}" \
            -out=tfplan
        env:
          ARM_CLIENT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}

      - name: Print deployed URL
        working-directory: terraform
        run: terraform output container_app_url
        env:
          ARM_CLIENT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientId }}
          ARM_CLIENT_SECRET:   ${{ fromJSON(secrets.AZURE_CREDENTIALS).clientSecret }}
          ARM_SUBSCRIPTION_ID: ${{ fromJSON(secrets.AZURE_CREDENTIALS).subscriptionId }}
          ARM_TENANT_ID:       ${{ fromJSON(secrets.AZURE_CREDENTIALS).tenantId }}