name: CI — utility-charge-service

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Run tests
        id: tests
        continue-on-error: true
        run: ./mvnw clean test -B -Dspring.profiles.active=test
        env:
          JWT_SECRET: test-secret-key-for-ci-only-not-production-256bits

      - name: Build JAR
        id: build
        continue-on-error: true
        run: ./mvnw package -DskipTests -B

      - name: Secret scanning
        id: secrets
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Post CI status report
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const testResult = '${{ steps.tests.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const buildResult = '${{ steps.build.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const secretsResult = '${{ steps.secrets.outcome }}' === 'success' ? '✅ Passed' : '❌ Failed';
            const overall = (
              '${{ steps.tests.outcome }}' === 'success' &&
              '${{ steps.build.outcome }}' === 'success' &&
              '${{ steps.secrets.outcome }}' === 'success'
            ) ? '✅ Passed' : '❌ Failed';
            const commit = context.sha.substring(0, 7);

            const body = `🚀 **Utility Charge Service CI Status Report**

            | Check | Result |
            |---|---|
            | Backend Tests | ${testResult} |
            | Build | ${buildResult} |
            | Secret Scanning | ${secretsResult} |

            **Overall Pipeline Status:** ${overall}
            **Commit:** \`${commit}\``;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

      - name: Fail job if any check failed
        if: steps.tests.outcome != 'success' || steps.build.outcome != 'success' || steps.secrets.outcome != 'success'
        run: exit 1