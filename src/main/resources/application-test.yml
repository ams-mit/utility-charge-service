spring:
  datasource:
    url: jdbc:h2:mem:utility_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  sql:
    init:
      mode: never

ams:
  jwt:
    secret: test-secret-key-for-unit-testing-only-not-production-256bits

logging:
  level:
    com.ams.utility: DEBUG