spring:
  application:
    name: ${SERVICE_NAME:utility-charge-service}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/utility_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 20

  sql:
    init:
      mode: never

server:
  port: ${PORT:8082}
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    app:
      name: utility-charge-service
      version: 1.0.0
      description: AMS Group 3 - Utility Charge Recording and Calculation

ams:
  security:
    gateway-public-key: ${GATEWAY_JWT_PUBLIC_KEY}
    service-private-key: ${SERVICE_JWT_PRIVATE_KEY}
    jwt-algorithm: ${JWT_ALGORITHM:RS256}
    service-jwt-expires-in: ${SERVICE_JWT_EXPIRES_IN:5m}
    api-gateway-url: ${API_GATEWAY_URL:https://api-gateway.ams.com}

logging:
  level:
    com.ams.utility: DEBUG
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
