ams:
  security:
    gateway-public-key: "-----BEGIN PUBLIC KEY----------END PUBLIC KEY-----"
    service-private-key: "-----BEGIN PRIVATE KEY----------BEGIN PRIVATE KEY----------END PRIVATE KEY----------END PRIVATE KEY-----"
    jwt-algorithm: RS256
    service-jwt-expires-in: 5m

spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
